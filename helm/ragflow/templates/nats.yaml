apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ragflow.fullname" . }}-nats
spec:
  serviceName: {{ include "ragflow.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels:
      app: ragflow-nats
  template:
    metadata:
      labels:
        app: ragflow-nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          command: ["-js"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragflow.fullname" . }}-nats
spec:
  ports:
    - port: 4222
      targetPort: 4222
      name: client
    - port: 8222
      targetPort: 8222
      name: monitor
  selector:
    app: ragflow-nats
