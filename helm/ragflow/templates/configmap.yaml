apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragflow.fullname" . }}-config
data:
  service_conf.yaml: |
    mysql:
      host: {{ include "ragflow.fullname" . }}-mysql
      port: 3306
      user: {{ .Values.mysql.auth.username }}
      password: ${MYSQL_PASSWORD}
      db: {{ .Values.mysql.auth.database }}
    redis:
      host: {{ include "ragflow.fullname" . }}-redis-master
      port: 6379
      db: 0
    minio:
      endpoint: {{ include "ragflow.fullname" . }}-minio:9000
      access_key: {{ .Values.minio.auth.rootUser }}
      secret_key: ${MINIO_SECRET_KEY}
    infinity:
      host: {{ include "ragflow.fullname" . }}-infinity
      port: 23817
    nats:
      endpoints: "nats://{{ include "ragflow.fullname" . }}-nats:4222"
    ragflow:
      go_port: 9380
      python_port: 9381
    auth:
      jwt_secret: ${JWT_SECRET}
      jwt_expiration_minutes: 1440
      session_ttl_minutes: 1440
    syncer:
      poll_interval_sec: 5
      batch_size: 10
      max_in_flight: 50
