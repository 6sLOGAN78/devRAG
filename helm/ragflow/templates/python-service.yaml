apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragflow.fullname" . }}-python
  labels:
    app: ragflow-python
spec:
  type: {{ .Values.python.service.type }}
  ports:
    - port: {{ .Values.python.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: ragflow-python
