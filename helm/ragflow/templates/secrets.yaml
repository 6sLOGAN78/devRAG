apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ragflow.fullname" . }}-secrets
type: Opaque
stringData:
  MYSQL_PASSWORD: "{{ .Values.mysql.auth.password }}"
  MINIO_SECRET_KEY: "{{ .Values.minio.auth.rootPassword }}"
  JWT_SECRET: "default-dev-secret-do-not-use-in-prod"
  # Any LLM keys should be added here
