# Application stack: one-shot `init` (migrations, bucket, Go schema verify) then `app`
# (Nginx + Go + Python under tini). Infrastructure comes from docker-compose-base.yml.
# Source: docs/18-deployment/docker-compose.md; behaviour decisions D-23, D-24, D-29, R-64.
include:
  - docker-compose-base.yml

x-app-env: &app-env
  # In-network ports are fixed: REDIS_PORT in docker/.env is the HOST mapping (6380) and must not leak here.
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DBNAME: ${MYSQL_DBNAME:-rag_flow}
  MYSQL_USER: ${MYSQL_USER:-ragflow_app}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is unset; run scripts/init_env.sh}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is unset; run scripts/init_env.sh}
  MINIO_HOST: minio
  MINIO_PORT: "9000"
  MINIO_USER: ${MINIO_USER:-rag_flow}
  MINIO_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is unset; run scripts/init_env.sh}
  ES_HOST: es01
  ES_PORT: "9200"
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is unset; run scripts/init_env.sh}
  SVR_HTTP_PORT: "9380"
  # Fixed: Nginx upstreams are generated from conf/routes.yaml (Go at 9384), so this is not configurable.
  GO_API_PORT: "9384"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is unset; run scripts/init_env.sh --append-missing}
  REGISTER_ENABLED: ${REGISTER_ENABLED:-1}
  SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-}
  SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-}
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURITY: ${SMTP_SECURITY:-none}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@devrag.local}
  DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-}
  DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-}
  DEFAULT_RERANK_MODEL: ${DEFAULT_RERANK_MODEL:-}
  DEFAULT_MODEL_FACTORY: ${DEFAULT_MODEL_FACTORY:-}
  DEFAULT_MODEL_BASE_URL: ${DEFAULT_MODEL_BASE_URL:-}
  RATE_LIMIT_REGISTER_PER_IP: ${RATE_LIMIT_REGISTER_PER_IP:-10}
  RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:-3600}
  RATE_LIMIT_LOGIN_FAILURES_PER_EMAIL: ${RATE_LIMIT_LOGIN_FAILURES_PER_EMAIL:-5}
  RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-30}
  RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
  RATE_LIMIT_OTP_EMAIL_INTERVAL_SECONDS: ${RATE_LIMIT_OTP_EMAIL_INTERVAL_SECONDS:-60}
  RATE_LIMIT_OTP_PER_EMAIL_PER_HOUR: ${RATE_LIMIT_OTP_PER_EMAIL_PER_HOUR:-5}
  RATE_LIMIT_OTP_PER_IP_PER_HOUR: ${RATE_LIMIT_OTP_PER_IP_PER_HOUR:-20}
  RATE_LIMIT_OTP_WINDOW_SECONDS: ${RATE_LIMIT_OTP_WINDOW_SECONDS:-3600}
  RATE_LIMIT_PROVIDER_TEST_PER_TENANT: ${RATE_LIMIT_PROVIDER_TEST_PER_TENANT:-10}
  RATE_LIMIT_PROVIDER_TEST_WINDOW_SECONDS: ${RATE_LIMIT_PROVIDER_TEST_WINDOW_SECONDS:-300}
  LLM_KEY_ENCRYPTION_KEY: ${LLM_KEY_ENCRYPTION_KEY:?LLM_KEY_ENCRYPTION_KEY is unset; run scripts/init_env.sh --append-missing}
  LLM_KEY_ID: ${LLM_KEY_ID:-k1}
  LLM_ALLOW_PRIVATE_BASE_URLS: ${LLM_ALLOW_PRIVATE_BASE_URLS:-false}
  LLM_CHAT_TIMEOUT_SECONDS: ${LLM_CHAT_TIMEOUT_SECONDS:-60}
  LLM_EMBEDDING_TIMEOUT_SECONDS: ${LLM_EMBEDDING_TIMEOUT_SECONDS:-30}
  LLM_KEY_TEST_TIMEOUT_SECONDS: ${LLM_KEY_TEST_TIMEOUT_SECONDS:-20}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
  STORAGE_IMPL: ${STORAGE_IMPL:-MINIO}
  STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/ragflow/data/storage}
  UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-104857600}
  UPLOAD_MAX_FILES_PER_REQUEST: ${UPLOAD_MAX_FILES_PER_REQUEST:-20}
  DATASET_MAX_DOCUMENTS: ${DATASET_MAX_DOCUMENTS:-10000}
  UPLOAD_BODY_TIMEOUT_SECONDS: ${UPLOAD_BODY_TIMEOUT_SECONDS:-600}
  UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS:-}
  TASK_PAGE_SIZE: ${TASK_PAGE_SIZE:-12}
  INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-64}
  INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}
  TASK_LOCK_TTL_SECONDS: ${TASK_LOCK_TTL_SECONDS:-60}
  RECLAIM_IDLE_MS: ${RECLAIM_IDLE_MS:-120000}
  RECLAIM_INTERVAL_SECONDS: ${RECLAIM_INTERVAL_SECONDS:-15}
  WORKER_HEARTBEAT_TIMEOUT: ${WORKER_HEARTBEAT_TIMEOUT:-120}
  PROGRESS_INTERVAL_SECONDS: ${PROGRESS_INTERVAL_SECONDS:-2}
  CANCEL_POLL_SECONDS: ${CANCEL_POLL_SECONDS:-1}
  INGEST_RETRY_BACKOFF_MAX_SECONDS: ${INGEST_RETRY_BACKOFF_MAX_SECONDS:-30}
  RECONCILE_AFTER_SECONDS: ${RECONCILE_AFTER_SECONDS:-300}
  XLSX_MAX_CELLS: ${XLSX_MAX_CELLS:-1000000}
  TEXT_PREVIEW_CHARS: ${TEXT_PREVIEW_CHARS:-262144}
  PARSE_RATE_MAX: ${PARSE_RATE_MAX:-120}
  PARSE_RATE_WINDOW_SECONDS: ${PARSE_RATE_WINDOW_SECONDS:-60}
  INGEST_TASK_CONCURRENCY: ${INGEST_TASK_CONCURRENCY:-1}
  INGEST_CHUNK_CONCURRENCY: ${INGEST_CHUNK_CONCURRENCY:-1}
  INGEST_EMBED_CONCURRENCY: ${INGEST_EMBED_CONCURRENCY:-2}
  INGEST_STORAGE_CONCURRENCY: ${INGEST_STORAGE_CONCURRENCY:-4}
  INGEST_KG_CONCURRENCY: ${INGEST_KG_CONCURRENCY:-1}
  PDF_RENDER_THREADS: ${PDF_RENDER_THREADS:-2}
  INGEST_QUEUE_PREFIX: ${INGEST_QUEUE_PREFIX:-te}
  INGEST_CONSUMER_GROUP: ${INGEST_CONSUMER_GROUP:-ragflow_consumer_group}
  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-1024}
  RETRIEVAL_RERANK_MAX_CANDIDATES: ${RETRIEVAL_RERANK_MAX_CANDIDATES:-16}
  RETRIEVAL_MSM_PERCENT: ${RETRIEVAL_MSM_PERCENT:-30}
  RETRIEVAL_MSM_RETRY_PERCENT: ${RETRIEVAL_MSM_RETRY_PERCENT:-10}
  RETRIEVAL_SYNONYM_TTL_SECONDS: ${RETRIEVAL_SYNONYM_TTL_SECONDS:-86400}
  RETRIEVAL_RATE_MAX: ${RETRIEVAL_RATE_MAX:-30}
  RETRIEVAL_RATE_WINDOW_SECONDS: ${RETRIEVAL_RATE_WINDOW_SECONDS:-60}
  CHAT_STREAM_DEADLINE_SECONDS: ${CHAT_STREAM_DEADLINE_SECONDS:-300}
  CHAT_MAX_QUESTION_CHARS: ${CHAT_MAX_QUESTION_CHARS:-8000}
  CHAT_MAX_SESSION_MESSAGES: ${CHAT_MAX_SESSION_MESSAGES:-400}
  CHAT_RATE_MAX: ${CHAT_RATE_MAX:-30}
  CHAT_RATE_WINDOW_SECONDS: ${CHAT_RATE_WINDOW_SECONDS:-60}
  CHAT_MESSAGE_PAGE_SIZE: ${CHAT_MESSAGE_PAGE_SIZE:-50}
  LOG_DIR: ${LOG_DIR:-/ragflow/logs}
  TZ: ${TIMEZONE:-UTC}
  DEEPDOC_URL: ${DEEPDOC_URL:-}
  TENSORRT_DLA_SVR: ${TENSORRT_DLA_SVR:-}
  DEEPDOC_API_TOKEN: ${DEEPDOC_API_TOKEN:-}

services:
  deepdoc:
    profiles: [deepdoc]
    build:
      context: ..
      dockerfile: docker/Dockerfile.deepdoc
    image: ${DEEPDOC_IMAGE:-devrag-deepdoc:local}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    environment:
      DEEPDOC_API_TOKEN: ${DEEPDOC_API_TOKEN:-}
      DEEPDOC_MODEL_DIR: /models
    volumes:
      - ${DEEPDOC_MODEL_DIR:-../ragflow-logs/deepdoc-models}:/models:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks: [deepdoc]
    healthcheck:
      test: ["CMD", "/ragflow/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9390/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

  init:
    profiles: [cpu]
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${RAGFLOW_IMAGE:-devrag-app:local}
    restart: "no"
    entrypoint: ["tini", "--", "/ragflow/docker/entrypoint_init.sh"]
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      es01:
        condition: service_healthy
        required: false
    networks:
      - ragflow

  app:
    profiles: [cpu]
    image: ${RAGFLOW_IMAGE:-devrag-app:local}
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
    ports:
      - ${BIND_HOST:-127.0.0.1}:${SVR_WEB_HTTP_PORT:-8080}:80
      - ${BIND_HOST:-127.0.0.1}:${SVR_WEB_HTTPS_PORT:-8443}:443
    volumes:
      - ../ragflow-logs:/ragflow/logs
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/ragflow/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      ragflow:
        aliases: [ragflow-app]
      deepdoc:

  # Parsing worker: same image as app, no port, no name, so `--scale task-executor=N` needs no configuration (ING-04).
  # Each replica registers its own consumer (te_<host>_<pid>_<rand>) in the shared group. Dev-only settings live in the dev file.
  task-executor:
    profiles: [cpu]
    image: ${RAGFLOW_IMAGE:-devrag-app:local}
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["tini", "--", "/ragflow/docker/entrypoint_task_executor.sh"]
    environment:
      <<: *app-env
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/ragflow/docker/healthcheck_task_executor.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ragflow
      - deepdoc

networks:
  deepdoc:
    internal: true
