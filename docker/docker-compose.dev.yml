# Dev memory caps for a 15 GB shared host (D-29, R-56, R-72). Documented values stay in the base file.
services:
  deepdoc:
    image: ${DEEPDOC_IMAGE:-devrag-deepdoc:local}
    profiles: [deepdoc]
    mem_limit: 3g
    cpus: 2
    ports:
      - 127.0.0.1:${DEEPDOC_PORT:-9390}:9390
  tei:
    # R-219: full timing + startup guard peak 2267.136 MiB; 25% headroom rounded to 256 MiB gives 3 GiB.
    mem_limit: 3g
    cpus: 4
    # Optional host-specific physical cores; empty means no affinity constraint.
    cpuset: ${TEI_CPUSET:-}
    # First startup restarted in the Candle CPU path; retry with the planned AVX2 cap.
    environment:
      MKL_ENABLE_INSTRUCTIONS: AVX2
      # Smaller warmup and a four-thread pool kept the measured BGE working set below 3 GiB.
      MAX_BATCH_TOKENS: "1024"
  es01:
    mem_limit: 2g
    environment:
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.routing.allocation.disk.watermark.low: 1gb
      cluster.routing.allocation.disk.watermark.high: 750mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
  mysql:
    mem_limit: 640m
    command:
      - --max_connections=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
  redis:
    mem_limit: 160m
  minio:
    mem_limit: 256m
  # The app services are profile-gated; image is repeated so this file stays valid on its own
  # (infra-only runs include this file without the cpu profile).
  init:
    profiles: [cpu]
    image: ${RAGFLOW_IMAGE:-devrag-app:local}
    mem_limit: 256m
  # Per-IP rate limits only (D-29, R-94). Every e2e, live and clean-room request reaches Go from one address
  # through Nginx, so the production per-IP windows would return 429. Per-email limits stay at production
  # values; tests that need them use dedicated emails. Never copy these into docker-compose.yml.
  app:
    profiles: [cpu]
    image: ${RAGFLOW_IMAGE:-devrag-app:local}
    mem_limit: 768m
    environment:
      RATE_LIMIT_REGISTER_PER_IP: ${DEV_RATE_LIMIT_PER_IP_MAX:-100000}
      RATE_LIMIT_LOGIN_PER_IP: ${DEV_RATE_LIMIT_PER_IP_MAX:-100000}
      RATE_LIMIT_OTP_PER_IP_PER_HOUR: ${DEV_RATE_LIMIT_PER_IP_MAX:-100000}
      # Dev only (never production compose): tests point a provider at a fake server on the host.
      LLM_ALLOW_PRIVATE_BASE_URLS: ${DEV_LLM_ALLOW_PRIVATE_BASE_URLS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # Parsing worker: 384m (D-29), set in plan 04-35 from a measured peak of about 193 MiB (R-188); the starting limit was 768m. Same dev-only SSRF relaxation as app; never copy into docker-compose.yml.
  task-executor:
    profiles: [cpu]
    image: ${RAGFLOW_IMAGE:-devrag-app:local}
    mem_limit: 384m
    environment:
      LLM_ALLOW_PRIVATE_BASE_URLS: ${DEV_LLM_ALLOW_PRIVATE_BASE_URLS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # Dev-only mail catcher for the password-reset flow (D-05, D-20, R-95, R-96). It lives in this file only: production
  # compose and docker-compose-base.yml carry SMTP settings but no mail service. SMTP (1025) is reachable inside the
  # network as mailpit:1025; only the HTTP API is published, on loopback, for test read-back.
  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - 127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025
    networks:
      ragflow:
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

# Docker suppresses host-port publication on an internal-only bridge. Dev probes need
# loopback 9390; the production topology stays internal and publishes no port.
networks:
  deepdoc:
    internal: false
